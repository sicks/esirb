plugins:
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

# Some examples need real setup, like two clients sharing a store.
RSpec/ExampleLength:
  Max: 12

# Describes request behavior across Client and Path, not a single class.
RSpec/DescribeClass:
  Exclude:
    - "spec/esirb/requests_spec.rb"
